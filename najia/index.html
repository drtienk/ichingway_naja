<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#20243a">
  <title>京房納甲裝卦</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">獨立工具</p>
        <h1>京房納甲裝卦</h1>
        <p class="subtitle">排本卦、變卦、納干支、六親、世應、六獸、旬空與伏神</p>
      </div>
    </header>

    <nav class="app-tabs" aria-label="主要功能">
      <a class="app-tab active" href="index.html" aria-current="page">裝卦</a>
      <a class="app-tab" href="../易經股市應證.html">股市應證</a>
    </nav>

    <section class="card controls" aria-labelledby="cast-settings">
      <div class="section-heading">
        <div>
          <p class="step">STEP 01</p>
          <h2 id="cast-settings">設定卦象</h2>
        </div>
        <p>由下往上選爻，初爻為第一爻。</p>
      </div>

      <label class="matter-field">
        <span>占事（這次要問的事）</span>
        <input type="text" id="castMatter" maxlength="120" placeholder="例如：問工作、投資、健康或某件事情的發展">
      </label>

      <div class="selectors">
        <fieldset>
          <legend>上卦・外卦</legend>
          <div class="trigram-grid" id="upperGrid"></div>
        </fieldset>
        <fieldset>
          <legend>下卦・內卦</legend>
          <div class="trigram-grid" id="lowerGrid"></div>
        </fieldset>
      </div>

      <div class="cast-options">
        <fieldset class="moving-fieldset">
          <legend>動爻（可複選，也可不選）</legend>
          <div class="moving-grid" id="movingGrid"></div>
        </fieldset>
        <label class="date-field">
          <span>日期時間（本地）</span>
          <input type="datetime-local" id="castDate">
        </label>
        <button class="primary-button" id="castButton" type="button">排出納甲卦盤</button>
      </div>
    </section>

    <section id="result" aria-live="polite"></section>

    <footer>
      <p>本工具只排卦，不連線、不抓股價；占事與卦盤只在目前畫面及匯出的圖片中使用。</p>
    </footer>
  </main>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
