<!DOCTYPE html>
<html lang="zh-Hant" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f2236">
<link rel="icon" type="image/png" sizes="180x180" href="icon-najia-180.png?v=20260815-1">
<link rel="apple-touch-icon" sizes="180x180" href="icon-najia-180.png?v=20260815-1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I-ChingWay 命卦">
<title>I-ChingWay 命卦</title>
<style>
  :root { --bg:#f5f4ee; --ink:#1f2236; --gold:#ceb078; --red:#ad5a55; --card:#fff; --muted:#777061; --line:#d8d2c0; }
  * { box-sizing:border-box; }
  body { margin:0; padding:18px; color:var(--ink); background:var(--bg); font-family:"Microsoft JhengHei","PingFang TC",sans-serif; line-height:1.55; }
  button,select,input { font:inherit; }
  .shell { width:min(100%,980px); margin:0 auto; }
  .page-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-mark { display:grid; width:42px; height:42px; place-items:center; flex:none; color:var(--gold); background:var(--ink); border-radius:9px; font-size:26px; }
  .brand-copy { min-width:0; }
  .brand-copy strong { display:block; font-family:Georgia,"Times New Roman",serif; font-size:22px; line-height:1.1; }
  .brand-copy span { display:block; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.08em; }
  .language-switch { display:flex; flex:none; gap:3px; padding:3px; border:1px solid var(--line); border-radius:7px; background:#fff; }
  .language-switch button { min-height:30px; padding:4px 8px; color:var(--muted); background:transparent; border:0; border-radius:5px; cursor:pointer; font-size:12px; font-weight:800; }
  .language-switch button.active { color:#fff; background:var(--ink); }
  .site-nav { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin-bottom:14px; }
  .site-nav a { display:flex; min-width:0; min-height:40px; align-items:center; justify-content:center; padding:6px 3px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:7px; text-align:center; text-decoration:none; font-size:14px; font-weight:800; line-height:1.15; }
  .site-nav a.active { color:var(--gold); background:var(--ink); border-color:var(--ink); }
  .card { margin:12px 0; padding:18px; background:var(--card); border-radius:10px; box-shadow:0 2px 8px #0000000d; }
  .intro-card { border-top:4px solid var(--gold); }
  h1,h2,h3,p { margin-top:0; }
  h1 { margin-bottom:5px; font-size:25px; }
  .intro-card p { margin-bottom:0; color:var(--muted); font-size:13px; }
  .form-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px; align-items:end; }
  .field { display:flex; min-width:0; flex-direction:column; gap:5px; }
  .field span { color:#52566e; font-size:12px; font-weight:800; }
  .field select { width:100%; min-width:0; min-height:43px; padding:7px 28px 7px 9px; color:var(--ink); background:#fff; border:1.5px solid #bbb; border-radius:7px; }
  .name-field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; color:#52566e; font-size:14px; font-weight:800; }
  .name-field input { width:100%; min-height:44px; padding:9px 11px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:8px; }
  .name-field input::placeholder { color:#aaa396; }
  .timezone-field { grid-column:span 2; }
  .input-note { margin:12px 0 0; color:var(--muted); font-size:12px; }
  .error { margin:12px 0; padding:12px 14px; color:#8b1e1e; background:#fff0f0; border:1px solid #e7bcbc; border-radius:8px; font-weight:700; }
  .result-card { border-top:4px solid var(--ink); }
  .section-title { margin-bottom:12px; color:var(--ink); font-size:18px; }
  .conversion-banner { display:flex; flex-wrap:wrap; gap:7px 15px; margin-bottom:14px; padding:11px 13px; color:#e9e3d4; background:var(--ink); border-radius:8px; font-size:13px; }
  .conversion-banner strong { color:#fff; }
  .lunar-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .metric { min-width:0; padding:11px 8px; background:#fff8e8; border:1px solid #eadcbf; border-radius:8px; text-align:center; }
  .metric span { display:block; color:var(--muted); font-size:11px; }
  .metric strong { display:block; margin-top:3px; overflow-wrap:anywhere; color:#784e22; font-size:19px; }
  .rules-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; margin-top:14px; }
  .rule { padding:12px; background:#f6f5f0; border-left:4px solid var(--gold); border-radius:6px; }
  .rule.hour-rule { border-left-color:var(--red); }
  .rule span { display:block; color:var(--muted); font-size:11px; }
  .rule strong { display:block; margin-top:4px; overflow-wrap:anywhere; font-size:15px; }
  .hex-card { border-top:4px solid var(--red); }
  .person-result { margin:0 0 10px; padding:8px 11px; color:#5d4a23; background:#fff8e8; border-left:4px solid var(--gold); border-radius:6px; font-size:14px; }
  .person-result strong { margin-right:8px; color:var(--ink); }
  .hex-heading { display:flex; flex-wrap:wrap; align-items:baseline; gap:7px; margin-bottom:6px; }
  .hex-heading h2 { margin:0; font-size:26px; }
  .hex-heading .to { color:var(--muted); font-weight:800; }
  .hex-meta { margin:0 0 12px; color:var(--muted); font-size:13px; }
  .pillar-strip { display:flex; flex-wrap:wrap; gap:6px 13px; margin-bottom:12px; padding:8px 11px; color:#d9cfb9; background:#2a2e44; border-radius:7px; font-size:13px; font-weight:800; }
  .pillar-strip b { color:#fff; }
  .lines { border-top:1px solid #e5dfd2; }
  .line-heading { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) 84px; gap:7px; padding:7px 5px; color:var(--muted); background:#faf8f2; border-bottom:1px solid #e5dfd2; text-align:center; font-size:11px; font-weight:900; }
  .line-row { display:grid; grid-template-columns:minmax(0,1fr) 104px 84px; gap:7px; align-items:center; min-height:88px; padding:10px 5px; border-bottom:1px solid #e5dfd2; }
  .line-row.has-change { grid-template-columns:minmax(0,1fr) minmax(0,1fr) 84px; min-height:94px; }
  .line-row:not(.has-change) .original-panel { grid-column:1 / 3; }
  .line-row.has-change .changed-panel { grid-column:1; }
  .line-row.has-change .original-panel { grid-column:2; }
  .line-row .beast { grid-column:3; }
  .line-row.moving { background:#fff8e8; }
  .line-panel { display:grid; width:100%; min-width:0; grid-template-columns:minmax(82px,1fr) 104px; align-items:center; justify-items:center; gap:5px; }
  .changed-panel { padding-right:7px; border-right:1px solid #ded7c8; }
  .original-panel { padding-left:7px; }
  .line-info { display:flex; min-width:0; flex-direction:column; align-items:center; text-align:center; line-height:1.25; }
  .line-info strong { overflow-wrap:anywhere; font-size:22px; line-height:1.2; }
  .line-info span { overflow-wrap:anywhere; color:var(--muted); font-size:18px; line-height:1.25; }
  .line-info small { margin-top:2px; color:#80652f; font-size:12px; }
  .line-visual { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .yao { position:relative; display:block; width:78px; height:11px; }
  .yao.yang { background:var(--ink); }
  .yao.yin::before,.yao.yin::after { content:""; position:absolute; top:0; width:33px; height:11px; background:var(--ink); }
  .yao.yin::before { left:0; }
  .yao.yin::after { right:0; }
  .move-mark { position:absolute; left:50%; top:50%; z-index:2; transform:translate(-50%,-50%); color:#d11; pointer-events:none; }
  .move-mark.yang-mark { width:22px; height:22px; border:3px solid #d11; border-radius:50%; }
  .move-mark.yin-mark { font-size:31px; font-weight:900; line-height:1; }
  .relation { min-height:19px; color:var(--red); font-size:16px; line-height:19px; font-weight:900; }
  .beast { overflow-wrap:anywhere; text-align:center; font-size:17px; font-weight:800; }
  html[data-lang="en"] .line-info strong,html[data-lang="bi"] .line-info strong { font-size:14px; }
  html[data-lang="en"] .line-info span,html[data-lang="bi"] .line-info span { font-size:12px; }
  .result-note { margin:12px 0 0; color:var(--muted); font-size:11px; }
  .record-button { width:100%; min-height:44px; margin-top:14px; padding:10px 16px; color:#f4d89d; background:var(--ink); border:0; border-radius:9px; cursor:pointer; font-weight:900; letter-spacing:.06em; }
  .record-button:hover { background:#303650; }
  .record-button.saved { color:#fff; background:#39704b; }
  .history-card { border-top:4px solid var(--ink); }
  .history-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .history-head h2 { margin:0; font-size:19px; }
  .history-clear { min-height:34px; padding:5px 12px; color:var(--red); background:#f7f3e9; border:1px solid var(--line); border-radius:8px; cursor:pointer; font-size:13px; font-weight:800; }
  .history-note { margin:6px 0 12px; color:var(--muted); font-size:12px; }
  .history-list { display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none; }
  .history-item { display:flex; align-items:stretch; gap:6px; }
  .history-open { display:flex; flex:1; min-width:0; flex-direction:column; gap:2px; padding:10px 12px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:10px; cursor:pointer; text-align:left; }
  .history-open:hover { border-color:var(--gold); background:#fffdf5; }
  .history-name { overflow:hidden; font-size:15px; font-weight:800; text-overflow:ellipsis; white-space:nowrap; }
  .history-name.is-empty { color:#a9a294; font-weight:600; }
  .history-hex { overflow:hidden; color:var(--red); font-size:14px; font-weight:800; text-overflow:ellipsis; white-space:nowrap; }
  .history-hex .to { color:var(--muted); font-weight:600; }
  .history-meta { color:var(--muted); font-size:11px; line-height:1.4; }
  .history-delete { flex:0 0 auto; width:40px; color:var(--muted); background:#f7f3e9; border:1px solid var(--line); border-radius:10px; cursor:pointer; font-size:15px; font-weight:900; }
  .history-delete:hover,.history-clear:hover { color:#fff; background:var(--red); border-color:var(--red); }
  footer { padding:10px 3px; color:var(--muted); text-align:center; font-size:11px; }
  [hidden] { display:none !important; }
  @media (max-width:760px) {
    body { padding:10px; }
    .form-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .timezone-field { grid-column:span 2; }
    .card { padding:13px; }
  }
  @media (max-width:520px) {
    body { padding:6px; }
    .page-header { margin-bottom:7px; }
    .brand-mark { width:35px; height:35px; font-size:22px; }
    .brand-copy strong { font-size:19px; }
    .brand-copy span { font-size:10px; }
    .language-switch button { padding-inline:5px; font-size:10px; }
    .site-nav { gap:3px; margin-bottom:7px; }
    .site-nav a { min-height:39px; padding:4px 1px; font-size:13px; letter-spacing:-.04em; }
    html[data-lang="en"] .site-nav,html[data-lang="bi"] .site-nav { grid-template-columns:repeat(2,minmax(0,1fr)); }
    html[data-lang="en"] .site-nav a,html[data-lang="bi"] .site-nav a { min-height:34px; font-size:11px; letter-spacing:0; }
    .card { margin:7px 0; padding:10px; border-radius:8px; }
    h1 { font-size:21px; }
    .form-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
    .timezone-field { grid-column:1 / -1; }
    .field select { min-height:40px; }
    .lunar-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .rules-grid { grid-template-columns:1fr; }
    .hex-heading h2 { font-size:21px; }
    .line-heading { grid-template-columns:minmax(0,1fr) minmax(0,1fr) 58px; gap:3px; padding-inline:2px; }
    .line-row { grid-template-columns:minmax(0,1fr) 82px 58px; gap:3px; min-height:88px; padding-inline:2px; }
    .line-row.has-change { grid-template-columns:minmax(0,1fr) minmax(0,1fr) 58px; min-height:94px; padding:5px 2px; }
    .line-panel { grid-template-columns:minmax(48px,1fr) 78px; gap:2px; }
    .changed-panel { padding-right:3px; }
    .original-panel { padding-left:3px; }
    .line-info strong { font-size:19px; line-height:1.2; }
    .line-info span { font-size:17px; line-height:1.25; }
    .line-info small { font-size:10px; }
    .beast { font-size:17px; line-height:1.25; }
    .yao { width:78px; height:12px; }
    .yao.yin::before,.yao.yin::after { width:33px; height:12px; }
    .move-mark.yang-mark { width:25px; height:25px; border-width:4px; }
    .move-mark.yin-mark { font-size:35px; }
    html[data-lang="en"] .line-info strong,html[data-lang="bi"] .line-info strong { font-size:11px; }
    html[data-lang="en"] .line-info span,html[data-lang="bi"] .line-info span { font-size:10px; }
    html[data-lang="en"] .beast,html[data-lang="bi"] .beast { font-size:10px; }
    .name-field { gap:3px; margin-bottom:10px; font-size:12px; }
    .name-field input { min-height:40px; padding:6px 8px; }
    .record-button { min-height:42px; margin-top:12px; }
    .history-head h2 { font-size:15px; }
    .history-clear { min-height:30px; padding:3px 9px; font-size:11px; }
    .history-note { margin:4px 0 8px; font-size:11px; }
    .history-list { gap:6px; }
    .history-open { padding:8px 9px; border-radius:8px; }
    .history-name { font-size:14px; }
    .history-hex { font-size:13px; }
    .history-meta { font-size:10px; }
    .history-delete { width:36px; border-radius:8px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="page-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">☰</span>
      <div class="brand-copy"><strong>I-ChingWay</strong><span data-i18n="brandSub">命卦・生辰起卦</span></div>
    </div>
    <div class="language-switch" role="group" aria-label="Language">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="bi">中英</button>
    </div>
  </header>

  <nav class="site-nav" aria-label="主要功能">
    <a href="index.html" data-i18n="navCast">裝卦</a>
    <a href="../易經股市應證.html" data-i18n="navStock">股市應證</a>
    <a href="calendar.html" data-i18n="navCalendar">萬年曆</a>
    <a class="active" href="life-hexagram.html" aria-current="page" data-i18n="navLife">命卦</a>
    <a href="fengshui-compass.html" data-i18n="navCompass">風水羅盤</a>
  </nav>

  <main>
    <section class="card intro-card">
      <h1 data-i18n="title">命卦</h1>
      <p data-i18n="intro">輸入出生國曆日期、選填時間與出生地時區；系統先換成中原標準時間及農曆，再以農曆月為下卦、農曆日為上卦、時辰配動爻。</p>
    </section>

    <section class="card" aria-labelledby="inputHeading">
      <h2 class="section-title" id="inputHeading" data-i18n="inputTitle">出生資料</h2>
      <label class="name-field">
        <span data-i18n="personNameLabel">命卦者名稱</span>
        <input id="personName" type="text" maxlength="120" autocomplete="name" data-i18n-placeholder="personNamePlaceholder" placeholder="請輸入姓名或稱呼">
      </label>
      <div class="form-grid">
        <label class="field"><span data-i18n="monthLabel">月</span><select id="monthSelect"></select></label>
        <label class="field"><span data-i18n="dayLabel">日</span><select id="daySelect"></select></label>
        <label class="field"><span data-i18n="yearLabel">西元年</span><select id="yearSelect"></select></label>
        <label class="field"><span data-i18n="hourLabel">時（選填）</span><select id="hourSelect"></select></label>
        <label class="field"><span data-i18n="minuteLabel">分</span><select id="minuteSelect"></select></label>
        <label class="field timezone-field"><span data-i18n="timezoneLabel">出生地時區</span><select id="timezoneSelect"></select></label>
      </div>
      <p class="input-note" id="inputNote"></p>
    </section>

    <div class="error" id="errorMessage" role="alert" hidden></div>

    <section class="card result-card" id="conversionResult" aria-live="polite">
      <h2 class="section-title" data-i18n="conversionTitle">中原標準時間與農曆</h2>
      <div class="conversion-banner" id="conversionBanner"></div>
      <div class="lunar-grid">
        <div class="metric"><span data-i18n="lunarYearLabel">農曆年</span><strong id="lunarYear"></strong></div>
        <div class="metric"><span data-i18n="lunarMonthLabel">農曆月</span><strong id="lunarMonth"></strong></div>
        <div class="metric"><span data-i18n="lunarDayLabel">農曆日</span><strong id="lunarDay"></strong></div>
        <div class="metric"><span data-i18n="lunarHourLabel">時辰</span><strong id="lunarHour"></strong></div>
      </div>
      <div class="rules-grid">
        <div class="rule"><span data-i18n="lowerRuleLabel">月數定下卦</span><strong id="lowerRule"></strong></div>
        <div class="rule"><span data-i18n="upperRuleLabel">日數定上卦</span><strong id="upperRule"></strong></div>
        <div class="rule hour-rule"><span data-i18n="hourRuleLabel">時辰定動爻</span><strong id="hourRule"></strong></div>
      </div>
    </section>

    <section class="card hex-card" id="hexResult" aria-live="polite">
      <p class="person-result" id="personResult" hidden></p>
      <div class="hex-heading" id="hexHeading"></div>
      <p class="hex-meta" id="hexMeta"></p>
      <div class="pillar-strip" id="pillarStrip"></div>
      <div class="lines" id="hexLines"></div>
      <p class="result-note" data-i18n="resultNote">卦盤使用京房納甲規則；化爻六親仍以本卦宮五行為準。閏月按該農曆月份數計算。</p>
      <button class="record-button" id="recordButton" type="button" data-i18n="recordButton">儲存命卦紀錄</button>
    </section>

    <section class="card history-card" id="historyCard" aria-labelledby="historyHeading" hidden>
      <div class="history-head">
        <h2 id="historyHeading" data-i18n="historyTitle">命卦紀錄</h2>
        <button class="history-clear" id="historyClear" type="button" data-i18n="historyClear">清除全部</button>
      </div>
      <p class="history-note" data-i18n="historyNote">只保存在這台裝置的瀏覽器，最多 20 筆；點一下可重新載入。</p>
      <ul class="history-list" id="historyList"></ul>
    </section>
  </main>

  <footer data-i18n="footer">所有換算只在本機瀏覽器進行，不上傳出生資料。</footer>
</div>

<script src="core.js?v=20260827-3"></script>
<script>
(function () {
  'use strict';

  function getZoneFormatter(zone){
    if (!formatterCache.has(zone)) formatterCache.set(zone,new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}));
    return formatterCache.get(zone);
  }
  function zoneParts(date,zone){
    const parts=getZoneFormatter(zone).formatToParts(date);
    const get=type=>+(parts.find(part=>part.type===type)||{}).value;
    return {year:get('year'),month:get('month'),day:get('day'),hour:get('hour'),minute:get('minute')};
  }
  function zonedDateTimeToInstant(fields,zone){
    const target=Date.UTC(fields.year,fields.month-1,fields.day,fields.hour,fields.minute);
    let guess=target;
    for(let i=0;i<4;i++){
      const shown=zoneParts(new Date(guess),zone);
      const delta=target-Date.UTC(shown.year,shown.month-1,shown.day,shown.hour,shown.minute);
      guess+=delta;
      if(delta===0)break;
    }
    const finalParts=zoneParts(new Date(guess),zone);
    if(Object.keys(fields).some(key=>finalParts[key]!==fields[key])) throw new Error(ui('invalidTime'));
    return new Date(guess);
  }
  function lunarInfo(date){

    const month=get('month').replace('月','');
    const monthNums={'正':1,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12};
    const plainMonth=month.replace(/^閏/,'');
    return {yearName:get('yearName'),relatedYear:get('relatedYear'),month:month,monthNumber:Number(monthNums[plainMonth]||plainMonth),isLeap:month.startsWith('閏'),dayNumber:Number(get('day'))};
  }

  const HISTORY_KEY='najia_life_hexagram_history';

  function normalizeHistoryRecord(item){
    if(!item||typeof item!=='object'||Array.isArray(item))return null;
    if(typeof item.id!=='string'||!item.id||item.id.length>120)return null;
    if(typeof item.name!=='string'||item.name.length>120)return null;
    if(!Number.isInteger(item.year)||item.year<1901||item.year>2100)return null;
    if(!Number.isInteger(item.month)||item.month<1||item.month>12)return null;
    if(!Number.isInteger(item.day)||item.day<1||item.day>daysInMonth(item.year,item.month))return null;
    if(item.hour!==null&&(!Number.isInteger(item.hour)||item.hour<0||item.hour>23))return null;
    if(!Number.isInteger(item.minute)||item.minute<0||item.minute>59)return null;
    if(typeof item.timezone!=='string'||!item.timezone||item.timezone.length>80)return null;
    if(typeof item.baseName!=='string'||typeof item.changedName!=='string')return null;
    if(typeof item.savedAt!=='string'||Number.isNaN(new Date(item.savedAt).getTime()))return null;
    try{
      new Intl.DateTimeFormat('en',{timeZone:item.timezone}).format(new Date(0));
      const source={year:item.year,month:item.month,day:item.day,hour:item.hour===null?12:item.hour,minute:item.minute};
      const instant=zonedDateTimeToInstant(source,item.hour===null?'Asia/Taipei':item.timezone);
      const china=zoneParts(instant,'Asia/Taipei');
      const lunar=lunarInfo(instant);
      if(!lunar||!Number.isInteger(lunar.monthNumber)||!Number.isInteger(lunar.dayNumber))return null;
      const life=core.lifeHexagramFromLunar(lunar.monthNumber,lunar.dayNumber,item.hour===null?null:china.hour);
      const expected=core.cast(life.upper.name,life.lower.name,life.movingIndexes,instant);
      if(item.baseName!==expected.base.name||item.changedName!==(expected.changed?expected.changed.name:''))return null;
    }catch(error){return null;}
    return {id:item.id,name:item.name,year:item.year,month:item.month,day:item.day,hour:item.hour,minute:item.minute,timezone:item.timezone,baseName:item.baseName,changedName:item.changedName,savedAt:item.savedAt};
  }
  function loadHistory(){
    let raw=null;
    try{raw=localStorage.getItem(HISTORY_KEY);}catch(error){return [];}
    if(!raw)return [];
    let parsed=null;
    try{parsed=JSON.parse(raw);}catch(error){return [];}
    if(!Array.isArray(parsed))return [];
    return parsed.map(normalizeHistoryRecord).filter(Boolean).slice(0,HISTORY_LIMIT);
  }
  function storeHistory(records){

  }
  function historySignature(record){

  function historyDateText(record){
    const date=record.year+'/'+pad2(record.month)+'/'+pad2(record.day);

  function saveCurrentReading(){

      year:+yearSelect.value,month:+monthSelect.value,day:+daySelect.value,
      hour:hourSelect.value===''?null:+hourSelect.value,minute:+minuteSelect.value,timezone:timezoneSelect.value,
      baseName:currentReading.result.base.name,changedName:currentReading.result.changed?currentReading.result.changed.name:'',savedAt:new Date().toISOString()
    });
    if(!record)return;
    const signature=historySignature(record);
    const records=loadHistory().filter(item=>historySignature(item)!==signature);
    records.unshift(record);
    storeHistory(records);
    renderHistory();

  function render(){

      const source={year:+yearSelect.value,month:+monthSelect.value,day:+daySelect.value,hour:12,minute:0};
      const hasTime=hourSelect.value!=='';
      if(hasTime){ source.hour=+hourSelect.value; source.minute=+minuteSelect.value; }
      const sourceZone=hasTime?timezoneSelect.value:'Asia/Taipei';
      const instant=zonedDateTimeToInstant(source,sourceZone);
      const china=zoneParts(instant,'Asia/Taipei');
      const lunar=lunarInfo(instant);
      if(!lunar||!Number.isInteger(lunar.monthNumber)||!Number.isInteger(lunar.dayNumber))throw new Error(ui('unsupported'));
      const life=core.lifeHexagramFromLunar(lunar.monthNumber,lunar.dayNumber,hasTime?china.hour:null);
      const result=core.cast(life.upper.name,life.lower.name,life.movingIndexes,instant);
      currentReading={result:result,life:life,lunar:lunar,instant:instant};
      document.getElementById('inputNote').textContent=hasTime?ui('timeInputNote'):ui('noTimeInputNote');
      document.getElementById('conversionBanner').innerHTML='<span><strong>'+ui('chinaTime')+'</strong> '+formatFields(china,hasTime)+'（UTC+8）</span>'+(hasTime?'<span><strong>'+ui('sourceTime')+'</strong> '+formatFields(source,true)+' · '+timezoneSelect.value+'</span>':'');
      document.getElementById('lunarYear').textContent=text(lunar.yearName+'年（'+lunar.relatedYear+'）',lunar.yearName+' ('+lunar.relatedYear+')');
      document.getElementById('lunarMonth').textContent=text(lunar.month+'月',(lunar.isLeap?'Leap ':'')+'Month '+lunar.monthNumber);
      document.getElementById('lunarDay').textContent=text(chineseDay(lunar.dayNumber),'Day '+lunar.dayNumber);
      document.getElementById('lunarHour').textContent=hasTime?branchText(life.hourBranch):ui('noHour');
      document.getElementById('lowerRule').textContent=remainderText(lunar.monthNumber,life.lowerNumber)+' → '+trigramText(life.lower)+' · '+ui('lowerHex');
      document.getElementById('upperRule').textContent=remainderText(lunar.dayNumber,life.upperNumber)+' → '+trigramText(life.upper)+' · '+ui('upperHex');
      document.getElementById('hourRule').textContent=hasTime?branchText(life.hourBranch)+' → '+ui('moving')+' '+lineName(life.movingLine-1):ui('noMoving');
      const nameValue=personName.value.trim();
      const personResult=document.getElementById('personResult');
      personResult.hidden=!nameValue;
      personResult.innerHTML=nameValue?'<strong>'+escapeHTML(ui('personNameLabel'))+'</strong>'+escapeHTML(nameValue):'';
      document.getElementById('hexHeading').innerHTML='<h2>'+hexText(result.base.name)+'</h2>'+(result.changed?'<span class="to">'+ui('to')+'</span><h2>'+hexText(result.changed.name)+'</h2>':'');
      document.getElementById('hexMeta').textContent=text('上卦 '+trigramZh(life.upper)+'・下卦 '+trigramZh(life.lower)+'・'+result.base.palace+'宮'+result.base.palaceElement+'・'+result.base.positionName+'卦','Upper '+trigramEn(life.upper)+' · Lower '+trigramEn(life.lower)+' · '+TRIGRAM_EN[result.base.palace][1]+UI.en.palace+' · '+ELEMENT_EN[result.base.palaceElement]);
      document.getElementById('pillarStrip').innerHTML='<span><b>'+text(result.yearGanzhi.stem+result.yearGanzhi.branch+'年',(STEM_EN[result.yearGanzhi.stem]||result.yearGanzhi.stem)+' '+(BRANCH_EN[result.yearGanzhi.branch]||result.yearGanzhi.branch)+' Year')+'</b></span><span><b>'+text(result.monthGanzhi.stem+result.monthGanzhi.branch+'月',(STEM_EN[result.monthGanzhi.stem]||result.monthGanzhi.stem)+' '+(BRANCH_EN[result.monthGanzhi.branch]||result.monthGanzhi.branch)+' Month')+'</b></span><span><b>'+text(result.ganzhi.stem+result.ganzhi.branch+'日',(STEM_EN[result.ganzhi.stem]||result.ganzhi.stem)+' '+(BRANCH_EN[result.ganzhi.branch]||result.ganzhi.branch)+' Day')+'</b></span><span>'+ui('void')+' '+result.voidBranches.map(branch=>text(branch,BRANCH_EN[branch]||branch)).join('、')+'</span>';
      renderLines(result);
      document.getElementById('conversionResult').hidden=false;
      document.getElementById('hexResult').hidden=false;
    }catch(err){
      currentReading=null;
      error.textContent=err&&err.message?err.message:ui('unsupported');
      error.hidden=false;
      document.getElementById('conversionResult').hidden=true;
      document.getElementById('hexResult').hidden=true;
    }
  }
  function applyLanguage(){
    document.documentElement.lang=lang==='en'?'en':'zh-Hant';
    document.documentElement.dataset.lang=lang;
    document.title=ui('title')+' · I-ChingWay';
    document.querySelectorAll('[data-i18n]').forEach(element=>element.textContent=ui(element.dataset.i18n));
    document.querySelectorAll('[data-i18n-placeholder]').forEach(element=>element.placeholder=ui(element.dataset.i18nPlaceholder));
    document.querySelectorAll('.language-switch button').forEach(button=>button.classList.toggle('active',button.dataset.lang===lang));
    hourSelect.options[0].textContent=ui('timeUnknown');
    populateTimezones();
    render();
    renderHistory();
  }

  try { lunarFormatter=new Intl.DateTimeFormat('zh-Hant-u-ca-chinese',{timeZone:'Asia/Taipei',year:'numeric',month:'long',day:'numeric'}); lunarFormatter.format(new Date()); } catch(error) { lunarFormatter=null; }
  populateDateSelects();
  populateTimezones();
  setTaiwanToday();
  [monthSelect,daySelect,yearSelect,hourSelect,minuteSelect,timezoneSelect].forEach(select=>select.addEventListener('change',()=>{
    if(select===monthSelect||select===yearSelect)updateDays();
    minuteSelect.disabled=hourSelect.value==='';
    render();
  }));
  personName.addEventListener('input',render);
  document.getElementById('recordButton').addEventListener('click',saveCurrentReading);
  document.getElementById('historyList').addEventListener('click',event=>{
    const removeButton=event.target.closest('[data-history-delete]');
    if(removeButton){
      storeHistory(loadHistory().filter(item=>item.id!==removeButton.dataset.historyDelete));
      renderHistory();
      return;
    }
    const openButton=event.target.closest('[data-history-id]');
    if(!openButton)return;
    const record=loadHistory().find(item=>item.id===openButton.dataset.historyId);
    if(record)applyHistoryRecord(record);
  });
  document.getElementById('historyClear').addEventListener('click',()=>{
    if(!window.confirm(ui('historyClearConfirm')))return;
    storeHistory([]);
    renderHistory();
  });
  document.querySelectorAll('.language-switch button').forEach(button=>button.addEventListener('click',()=>{ lang=button.dataset.lang; localStorage.setItem('najia_display_language',lang); applyLanguage(); }));
  minuteSelect.disabled=true;
  applyLanguage();
})();
</script>
</body>
</html>
